<!DOCTYPE html>
<html lang="pt-BR">

<body>
    <script>   
    var n1 = prompt("Digite o primeiro número:");

    var n2 = prompt("Digite o segundo número:");  

    n1 = parseInt(n1);
    n2 = parseInt(n2);

    var soma = n1 + n2;
    var subtracao = n1 - n2;
    var multiplicacao = n1 * n2;
    var divisao = n1 / n2;
    var resto = n1 % n2;



    document.write("<div class='resultado'>Primeiro número: " + n1 + "</div>");
    document.write("<div class='resultado'>Segundo número: " + n2 + "</div>"); 

    document.write("<div class='resultado'>Soma: " + soma + "</div>");
    document.write("<div class='resultado'>Subtração: " + subtracao + "</div>");
    document.write("<div class='resultado'>Multiplicação: " + multiplicacao + "</div>");
    document.write("<div class='resultado'>Divisão: " + divisao + "</div>");
    document.write("<div class='resultado'>Resto: " + resto + "</div>");

    // document.write("<h1 class='titulo'>Resultado das Operações</h1>");

     </script>
</body>
